<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Royal Knot — Enterprise Architecture Master Demonstration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f7f5ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      padding: 40px;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 1100px;
    }

    .coral-dot {
      width: 15px;
      height: 15px;
      background: #ff5733;
      border-radius: 50%;
      margin-bottom: 28px;
      box-shadow: 0 0 28px rgba(255, 87, 51, 0.7), 0 0 10px rgba(255, 87, 51, 0.4);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 18px rgba(255, 87, 51, 0.5), 0 0 8px rgba(255, 87, 51, 0.3);
        transform: scale(0.96);
      }
      100% {
        box-shadow: 0 0 32px rgba(255, 87, 51, 0.8), 0 0 14px rgba(255, 87, 51, 0.5);
        transform: scale(1.04);
      }
    }

    .title {
      font-family: 'Newsreader', 'Cormorant Garamond', Georgia, serif;
      font-size: 96px;
      font-weight: 400;
      color: #2b2b27;
      letter-spacing: -0.015em;
      line-height: 1.08;
      margin-bottom: 24px;
    }

    .subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 27px;
      font-weight: 400;
      color: #4a4a46;
      line-height: 1.55;
      max-width: 860px;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="coral-dot"></div>
    <h1 class="title">The Royal Knot</h1>
    <p class="subtitle">
      The luxury wedding management ERP and autonomous dual-bot ecosystem —
      and architectural master demonstration.
    </p>
  </div>
</body>
</html>
